# Comprehensive EU + UK frontier-tech research labs.
# 58 labs across robotics, embodied AI, foundational ML, computer vision,
# computational neuroscience, computational biology, neuromorphic hardware,
# and quantum.
#
# Each people_url was verified live by the research agent before inclusion,
# but lab pages move — re-run `frontier-scout roster` and watch for fetch
# failures.
#
# Drop this in as your `labs.yaml` (or cherry-pick) and run:
#   frontier-scout roster
#   frontier-scout enrich --limit 30
#   frontier-scout papers --since 7d
#   frontier-scout digest --since 7d

