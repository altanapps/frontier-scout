[project]
name = "frontier-scout"
version = "0.1.0"
description = "Scout frontier-tech research labs. Watch papers. Get a daily digest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "altanapps" }]
keywords = ["arxiv", "research", "scouting", "vc", "robotics", "frontier-tech"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "anthropic>=0.40.0",
  "arxiv>=2.1.0",
  "beautifulsoup4>=4.12.0",
  "click>=8.1.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0",
  "flask>=3.0.0",
  "gunicorn>=22.0.0",
]

[project.urls]
Homepage = "https://github.com/altanapps/frontier-scout"
Issues = "https://github.com/altanapps/frontier-scout/issues"

[project.scripts]
frontier-scout = "frontier_scout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frontier_scout*"]
